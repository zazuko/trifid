name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write
      id-token: write

    steps:
      # This allow GitHub Actions to trigger the jobs for tags if needed
      - name: Generate token
        uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_PRIVATE_KEY }}

      - name: Checkout Repo
        uses: actions/checkout@v7
        with:
          # This makes Actions fetch all Git history so that Changesets can generate changelogs with the correct commits
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: pnpm

      - name: Install Dependencies
        run: pnpm ci

      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@v2
        with:
          # This expects you to have a script called release which does a build for your packages and calls changeset publish
          publish-script: pnpm run release
          commit-message: "chore: release"
          pr-title: "Merge to release"
          # v2 requires the token to be passed explicitly; the GITHUB_TOKEN
          # environment variable is no longer picked up
          github-token: ${{ steps.app-token.outputs.token }}
